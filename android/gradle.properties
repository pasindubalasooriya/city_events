org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is turned off deliberately.
#
# With JDK 21 on Windows, the Kotlin compile daemon memory-maps its incremental
# cache files (class-fq-name-to-source.tab and friends) and then cannot close
# them, which kills the daemon and fails the build with "Could not close
# incremental caches". It hit firebase_core, url_launcher_android and
# package_info_plus here, and survived a flutter clean.
#
# Turning incremental compilation off makes every Kotlin compile a full one.
# Those caches are then never created, so they cannot fail to close. The cost
# is a few extra seconds per Android build; the plugins are small and our own
# app code is Dart, which this does not affect at all.
kotlin.incremental=false
